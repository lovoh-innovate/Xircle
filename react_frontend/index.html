<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale=1 + user-scalable=no  → stops iOS auto-zoom on input focus
      viewport-fit=cover                  → makes env(safe-area-inset-*) resolve
                                             on notched iPhones
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- ===== PRIMARY META ===== -->
    <title>Xircle — Project Management · Color Your Workspace</title>
    <meta
      name="description"
      content="Xircle is a project management app that lets people choose their own color for each workspace. Stay organized, express your style."
    />
    <meta
      name="keywords"
      content="project management, team collaboration, workspace organizer, task management, Xircle, color your workspace"
    />
    <meta name="theme-color" content="#6C47FF" />

    <!-- ===== OPEN GRAPH / SOCIAL ===== -->
    <meta
      property="og:title"
      content="Xircle — Project Management · Color Your Workspace"
    />
    <meta
      property="og:description"
      content="Organize projects your way. Pick a unique color for every workspace in Xircle."
    />
    <meta property="og:image" content="/logo.jpeg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xircle.app" />
    <meta property="og:site_name" content="Lovoh Create" />

    <!-- ===== TWITTER CARD ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Xircle — Project Management · Color Your Workspace"
    />
    <meta
      name="twitter:description"
      content="Organize projects your way. Pick a unique color for every workspace in Xircle."
    />
    <meta name="twitter:image" content="/logo.jpeg" />

    <!-- ===== CANONICAL ===== -->
    <link rel="canonical" href="https://xircle.app" />

    <!-- ===== FAVICON & APP ICON ===== -->
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <meta name="apple-mobile-web-app-title" content="Xircle" />

    <!--
      Base styles + splash screen are intentionally removed from index.html.
      They now live in index.css (Tailwind layer) since the splash markup
      was already disabled. If you want the splash back, uncomment the
      markup below and move its CSS into index.css.
    -->
  </head>

  <body>
    <div id="root"></div>

    <!-- ===== REACT ENTRY ===== -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
