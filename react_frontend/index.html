<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== PRIMARY META ===== -->
    <title>Xircle — Project Management · Color Your Workspace</title>
    <meta
      name="description"
      content="Xircle is a project management app that lets people choose their own color for each workspace. Stay organized, express your style."
    />
    <meta name="theme-color" content="#6C47FF" />

    <!-- ===== OPEN GRAPH / SOCIAL ===== -->
    <meta
      property="og:title"
      content="Xircle — Project Management · Color Your Workspace"
    />
    <meta
      property="og:description"
      content="Organize projects your way. Pick a unique color for every workspace in Xircle."
    />
    <meta property="og:image" content="/logo.jpeg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xircle.app" />

    <!-- ===== TWITTER CARD ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Xircle — Project Management · Color Your Workspace"
    />
    <meta
      name="twitter:description"
      content="Organize projects your way. Pick a unique color for every workspace in Xircle."
    />
    <meta name="twitter:image" content="/logo.jpeg" />

    <!-- ===== FAVICON & APP ICON ===== -->
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />

    <!-- ===== FONTS (Google) ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- ===== BASE STYLES ===== -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", "Roboto", system-ui, -apple-system, sans-serif;
        background: #f8f9fe;
        color: #1a1a2e;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      input,
      textarea,
      select {
        font-size: 16px;
      }

      /* ── splash screen ── */
      .xircle-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
        padding: 2rem;
        animation: pulse 1.8s ease-in-out infinite;
      }

      .xircle-splash img {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 1.2rem;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(108, 71, 255, 0.25);
      }

      .xircle-splash p {
        font-size: 1.1rem;
        font-weight: 450;
        color: #6b6b8d;
        letter-spacing: 0.3px;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* hide splash once React renders */
      #root:has(> :not(.xircle-splash)) .xircle-splash {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- splash screen shown while React loads -->
      <div class="xircle-splash" aria-hidden="true">
        <img src="/logo.jpeg" alt="Xircle logo" />
        <p>Loading Xircle …</p>
      </div>
    </div>

    <!-- ===== REACT ENTRY ===== -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
